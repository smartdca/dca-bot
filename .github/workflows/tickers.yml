name: Update Ticker Database

on:
  schedule:
    - cron: '0 18 * * 0'   # 每週一 02:00（台北）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build ticker database
        id: build
        continue-on-error: true
        run: node scripts/build-tickers.mjs
      - name: Commit if changed
        run: |
          git config user.name "dca-bot"
          git config user.email "dca-bot@users.noreply.github.com"
          git add data/tickers-db.json
          git diff --cached --quiet || (git commit -m "Update ticker database" && git push)
      - name: Report partial failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "部分來源更新失敗，已保留舊資料，詳見上方 Build 步驟。"
          exit 1
